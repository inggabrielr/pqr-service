# ============================================================
# Pipeline de Integración Continua (CI) – pqr-service
# Compila, prueba, mide cobertura y analiza la calidad del código
# en cada pull request hacia main y después de cada merge.
# ============================================================
name: CI

# --- Cuándo se ejecuta ---
on:
  # Al abrir un PR hacia main o subir nuevos commits a un PR abierto:
  # valida el cambio ANTES de integrarlo.
  pull_request:
    branches: [ main ]
  # Al llegar commits a main (el merge):
  # valida la integración real DESPUÉS de unir los cambios.
  push:
    branches: [ main ]

# --- Permisos del pipeline (mínimo privilegio) ---
permissions:
  # Solo lectura del repositorio: el pipeline no puede modificar el código.
  contents: read
  # Permite pedir a GitHub un token de identidad OIDC,
  # usado para autenticarse en SonarQube Cloud sin secretos guardados.
  id-token: write

jobs:
  build:
    # Nombre del check que aparece en el PR
    # (se usará en las reglas de protección de rama).
    name: Compilar, probar y analizar
    # Máquina temporal de GitHub donde corre el pipeline.
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio en la máquina del pipeline.
      #    fetch-depth: 0 trae el historial completo de Git, que SonarQube
      #    necesita para identificar el código nuevo y a sus autores.
      - name: Descargar el código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. Instala Java 25 (Temurin), la misma versión del entorno local.
      #    cache: maven guarda las dependencias descargadas para que
      #    las siguientes ejecuciones sean más rápidas.
      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 3. Compila el proyecto, ejecuta las pruebas unitarias y de la API,
      #    y genera el reporte de cobertura con JaCoCo.
      #    Usa el Maven Wrapper para garantizar la misma versión de Maven.
      #    Si una prueba falla, el pipeline se detiene aquí.
      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B verify

      # 4. Guarda los resultados de las pruebas como archivo descargable.
      #    if: always() lo ejecuta aunque las pruebas fallen,
      #    que es cuando más se necesita revisar el detalle.
      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: target/surefire-reports/

      # 5. Guarda el reporte de cobertura de JaCoCo (HTML y XML)
      #    para consultarlo desde la pestaña Actions.
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-cobertura
          path: target/jacoco-report/

      # 6. Reutiliza los componentes del analizador de SonarQube
      #    descargados en ejecuciones anteriores, para acelerar el análisis.
      - name: Caché de SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 7. Autenticación sin secretos: cambia el token OIDC de GitHub
      #    por un token temporal de SonarQube Cloud (válido 30 minutos,
      #    solo con permiso de análisis). No hay credenciales guardadas.
      - name: Autenticar en SonarQube Cloud (OIDC, sin secretos)
        uses: SonarSource/sonarqube-auth-action@v1

      # 8. Analiza la calidad del código (errores, vulnerabilidades,
      #    duplicación, code smells) y envía la cobertura de JaCoCo.
      #    No repite las pruebas: usa lo generado en el paso 3.
      #    sonar.qualitygate.wait=true espera el resultado del quality gate
      #    y hace fallar el pipeline si el código nuevo no lo cumple.
      #    GITHUB_TOKEN (automático) permite asociar el análisis al PR.
      - name: Análisis de calidad con SonarQube Cloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true