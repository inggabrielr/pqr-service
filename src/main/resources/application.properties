quarkus.application.name=pqr-service
quarkus.http.port=9090

# Cobertura: conservar los datos de las pruebas unitarias y dejar el reporte al plugin de Maven
# reuse-data-file=true: evita que Quarkus borre el archivo al arrancar; sin esto, si las unitarias corren primero, sus datos se perderían.
# report=false: apaga el reporte de Quarkus para que haya un solo reporte, el del plugin, con todo combinado.
quarkus.jacoco.reuse-data-file=true
quarkus.jacoco.report=false